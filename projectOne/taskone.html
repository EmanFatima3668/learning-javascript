<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>hello ramzan kesy ho </h1>
    <button id="start">start krdo</button>
    <button id="stop">stop krdo</button>
</body>
<script>
   
   const color = function() {
    const hexa = "0123456789ABCDEF"
     let value = "#"
      for (i = 0 ; i < 6 ; i++){
        value += hexa[Math.floor(Math.random() * 16)]
      }
      return value 
   }
   console.log('color');

   let inervalId;

   const StartColor = function(){
    intervalId = setInterval(function(){
        document.body.style.backgroundColor = color()
    }, 1000)
   }
   const stopColor = function(){
    clearInterval(intervalId)
    inertvalId = null
   }
   document.querySelector("#start").addEventListener('click', StartColor)
   document.querySelector("#stop").addEventListener('click', stopColor)

</script>
</html>
